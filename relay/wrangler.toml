name = "dynamic-island-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Nothing about the traffic is logged (the Worker never calls console.*); keep request logs off too.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects work on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
