name: Release

# Publishing a tag vX.Y.Z builds DynamicIsland.exe, DynamicIsland-Leve.exe and DynamicIsland-Android.apk,
# attaches them to the GitHub release with their sha256 digests and makes sure the notes carry
# a `versionCode: N` line (the Windows app and the Android updater both read it).
# Manual runs (workflow_dispatch) build and verify everything but never create a release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          csproj_version="$(sed -n 's:.*<Version>\([0-9][0-9.]*\)</Version>.*:\1:p' DynamicIsland.csproj | head -n1)"
          [ -n "$csproj_version" ] || { echo "::error::no <Version> in DynamicIsland.csproj"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$tag' is not vX.Y.Z"; exit 1; }
            [ "${tag#v}" = "$csproj_version" ] || { echo "::error::tag $tag does not match <Version>$csproj_version</Version> in DynamicIsland.csproj"; exit 1; }
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          # same patterns as the csproj's AndroidVersionCode / AndroidVersionName; fails if missing or ambiguous
          info="$(.github/scripts/read-android-version.sh)"
          code="$(sed -n 's/^versionCode=//p' <<<"$info")"
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "::error::bad versionCode '$code'"; exit 1; }
          echo "version=$csproj_version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Windows $csproj_version; Android: $info"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/DynamicIsland.Tests/DynamicIsland.Tests.csproj -c Release
      - name: Publish DynamicIsland.exe (self-contained)
        shell: bash
        run: |
          dotnet publish DynamicIsland.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/full
      - name: Publish DynamicIsland-Leve.exe (--no-self-contained)
        shell: bash
        run: |
          dotnet publish DynamicIsland.csproj -c Release -r win-x64 --no-self-contained \
            -p:PublishSingleFile=true -p:DebugType=none -o out/leve
      - name: Collect and check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/full/DynamicIsland.exe dist/DynamicIsland.exe
          cp out/leve/DynamicIsland.exe dist/DynamicIsland-Leve.exe
          for f in dist/DynamicIsland.exe dist/DynamicIsland-Leve.exe; do
            [ -s "$f" ] || { echo "::error::$f missing or empty"; exit 1; }
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      # Release key from repository secrets (see android/ASSINATURA.md). android/app/build.gradle.kts reads DI_*.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      DI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      DI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
      EXPECTED_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$DI_STORE_PASSWORD" ] || [ -z "$DI_KEY_ALIAS" ] || [ -z "$DI_KEY_PASSWORD" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Release key secrets missing (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Refusing to publish an APK signed with the debug key."
              exit 1
            fi
            echo "::warning::No release key: this dry run signs with the debug key; do not publish the APK."
            exit 0
          fi
          key="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$key"
          echo "DI_STORE_FILE=$key" >> "$GITHUB_ENV"
      - name: Unit tests
        working-directory: android
        run: ./gradlew testReleaseUnitTest
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Collect and check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" != 1 ] || [ ! -s "${apks[0]}" ]; then echo "::error::expected exactly one release APK, got: ${apks[*]}"; exit 1; fi
          cp "${apks[0]}" dist/DynamicIsland-Android.apk
          # the APK must carry the versionCode the notes will announce
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)"
          actual="$("$aapt2" dump badging dist/DynamicIsland-Android.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)"
          [ "$actual" = "$EXPECTED_CODE" ] || { echo "::error::APK versionCode '$actual' != gradle versionCode '$EXPECTED_CODE'"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/DynamicIsland-Android.apk
          if-no-files-found: error

  release:
    # only for pushed tags; manual runs stop after the builds above
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify files and compute digests
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in DynamicIsland.exe DynamicIsland-Leve.exe DynamicIsland-Android.apk; do
            [ -s "$f" ] || { echo "::error::$f is missing from the build output"; exit 1; }
          done
          sha256sum DynamicIsland.exe DynamicIsland-Leve.exe DynamicIsland-Android.apk | tee SHA256SUMS.txt
          [ "$(wc -l < SHA256SUMS.txt)" = 3 ] || { echo "::error::expected 3 digests"; exit 1; }
      - name: Create or update the release (draft until verified)
        shell: bash
        run: |
          set -euo pipefail
          fence='```'
          {
            echo "versionCode: $CODE"
            echo
            echo "### sha256"
            echo "$fence"
            cat dist/SHA256SUMS.txt
            echo "$fence"
          } > mark.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a release made by hand for this tag: keep its notes, make sure the line is there
            gh release view "$TAG" --json body --jq .body > body.md
            if grep -Eiq 'version[[:space:]]*code[[:space:]]*[:=][[:space:]]*[0-9]+' body.md; then
              grep -Eiq "version[[:space:]]*code[[:space:]]*[:=][[:space:]]*$CODE([^0-9]|$)" body.md \
                || { echo "::error::existing notes carry a different versionCode than the APK ($CODE)"; exit 1; }
            else
              { cat body.md; echo; echo "versionCode: $CODE"; } > body2.md
              gh release edit "$TAG" --notes-file body2.md
            fi
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes --notes-file mark.md
          fi
          gh release upload "$TAG" --clobber dist/DynamicIsland.exe dist/DynamicIsland-Leve.exe dist/DynamicIsland-Android.apk dist/SHA256SUMS.txt
      - name: Publish and verify GitHub's digests
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          fail=0
          json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          for f in DynamicIsland.exe DynamicIsland-Leve.exe DynamicIsland-Android.apk; do
            want="sha256:$(sha256sum "dist/$f" | cut -d' ' -f1)"
            got="$(jq -r --arg n "$f" '.assets[] | select(.name==$n) | .digest // ""' <<<"$json")"
            if [ "$got" != "$want" ]; then echo "::error::$f digest on the release is '${got:-none}', expected $want"; fail=1; fi
          done
          jq -r '.body' <<<"$json" | grep -Eiq "version[[:space:]]*code[[:space:]]*[:=][[:space:]]*$CODE([^0-9]|$)" \
            || { echo "::error::release notes lack 'versionCode: $CODE'"; fail=1; }
          if [ "$fail" != 0 ]; then
            # never leave a half-checked release as "latest": the apps update from it
            gh release edit "$TAG" --draft=true || true
            exit 1
          fi
          echo "Release $TAG verified."
